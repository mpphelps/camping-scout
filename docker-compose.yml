services:
  db:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: campingmeow
      POSTGRES_PASSWORD: campingmeow
      POSTGRES_DB: campingmeow
    volumes:
      - pgdata:/var/lib/postgresql/data
  db-test:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: campingmeow
      POSTGRES_PASSWORD: campingmeow
      POSTGRES_DB: campingmeow_test
    volumes:
      - pgdata_test:/var/lib/postgresql/data
volumes:
  pgdata:
  pgdata_test:
